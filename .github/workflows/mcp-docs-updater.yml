name: MCP Docs Updater

on:
  schedule:
    # Run at 03:00 UTC on the 1st of every month
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync regardless of changes'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-knowledge-base:
    name: Scrape & Sync Antigravity Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-playwright-

      - name: Install Python dependencies
        working-directory: .agents/mcp-servers/antigravity-docs
        run: |
          pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Chromium browser
        working-directory: .agents/mcp-servers/antigravity-docs
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper — collect documentation links
        working-directory: .agents/mcp-servers/antigravity-docs
        run: python scraper.py

      - name: Run extractor — download documentation pages
        working-directory: .agents/mcp-servers/antigravity-docs
        run: python extractor.py

      - name: Check for changes in knowledge base
        id: diff
        working-directory: .agents/mcp-servers/antigravity-docs
        run: |
          git diff --quiet knowledge_base/ links.json || echo "changed=true" >> "$GITHUB_OUTPUT"
          PAGES_COUNT=$(ls -1 knowledge_base/*.md 2>/dev/null | wc -l)
          echo "pages_count=$PAGES_COUNT" >> "$GITHUB_OUTPUT"

      - name: Run Swarm QA Gate & Validation Checks
        if: steps.diff.outputs.changed == 'true' || github.event.inputs.force_sync == 'true'
        run: |
          echo "🔍 Running validation gates..."
          python3 -m py_compile scripts/*.py os-add-skill
          python3 scripts/validate-handshakes.py
          bash -n os-upgrade-project
          bash -n os-init
          bash -n os-init-claude
          echo "✅ All validation gates passed."

      - name: Publish Step Summary
        if: always()
        run: |
          TODAY=$(date -u '+%Y-%m-%d')
          PAGES="${{ steps.diff.outputs.pages_count }}"
          if [ "${{ steps.diff.outputs.changed }}" = "true" ] || [ "${{ github.event.inputs.force_sync }}" = "true" ]; then
            cat << SUMMARY > "$GITHUB_STEP_SUMMARY"
          ## 📚 Antigravity MCP Docs Updater ($TODAY)
          - **Status**: Updated knowledge base
          - **Total Documentation Pages**: $PAGES
          - **Destination**: \`.agents/mcp-servers/antigravity-docs/knowledge_base/\`
          SUMMARY
          else
            cat << SUMMARY > "$GITHUB_STEP_SUMMARY"
          ## 📚 Antigravity MCP Docs Updater ($TODAY)
          - **Status**: Knowledge base is up-to-date. No changes detected.
          SUMMARY
          fi

      - name: Create or Update Pull Request
        if: steps.diff.outputs.changed == 'true' || github.event.inputs.force_sync == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="automation/mcp-docs-sync"
          git checkout -B "$BRANCH_NAME"

          git add .agents/mcp-servers/antigravity-docs/knowledge_base/ \
                  .agents/mcp-servers/antigravity-docs/links.json

          if git diff --cached --quiet; then
            echo "No git changes to commit."
            exit 0
          fi

          COMMIT_DATE=$(date -u '+%Y-%m-%d')
          PAGES="${{ steps.diff.outputs.pages_count }}"
          git commit -m "chore(mcp): auto-refresh Antigravity docs ($COMMIT_DATE)"
          git push origin "$BRANCH_NAME" --force

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          PR_BODY="## 📚 Antigravity MCP Docs Updater ($COMMIT_DATE)
          - **Total Documentation Pages**: $PAGES
          - **MCP Server**: \`antigravity-docs\`
          - **Changes**: Refreshed knowledge base documents from https://antigravity.google/docs/getting-started"

          if [ -n "$EXISTING_PR" ]; then
            echo "Updating existing PR #$EXISTING_PR..."
            gh pr edit "$EXISTING_PR" \
              --title "chore(mcp): auto-refresh Antigravity docs ($COMMIT_DATE)" \
              --body "$PR_BODY" \
              --add-assignee "${{ github.repository_owner }}"
          else
            echo "Creating new PR..."
            gh pr create \
              --base master \
              --head "$BRANCH_NAME" \
              --title "chore(mcp): auto-refresh Antigravity docs ($COMMIT_DATE)" \
              --body "$PR_BODY" \
              --label "documentation,skip-qa,priority-low,risk-low" \
              --assignee "${{ github.repository_owner }}"
          fi

      - name: No changes detected
        if: steps.diff.outputs.changed != 'true' && github.event.inputs.force_sync != 'true'
        run: echo "Knowledge base is up-to-date. No commit needed."
